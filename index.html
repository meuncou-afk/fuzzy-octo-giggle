 R('#fff',W-54+P.x/T/2-1,6+P.y/T/2-1,3,3)}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();if(hold){const el=ui.querySelector('[data-a="'+hold.a+'"]');if(el){const p=Math.min(100,(performance.now()-hold.t0)/10);el.style.backgroundImage='linear-gradient(90deg,rgba(255,255,255,.4) '+p+'%,transparent '+p+'%)'}}requestAnimationFrame(loop)}
const K='village-save-v1';
function save(){try{localStorage.setItem(K,JSON.stringify({inv,HS:HS.map(h=>[h[0],h[1],h[2]]),own,armor,x:P.x,y:P.y}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(!d||!Array.isArray(d.HS)||!d.HS.length)return;
 HS.length=0;hs.clear();d.HS.forEach(h=>addH(h[0],h[1],h[2]));
 Object.assign(inv,d.inv);Object.assign(own,d.own);if(d.armor===false)armor=false;
 if(isFinite(d.x)&&isFinite(d.y)){P.x=P.tx=d.x;P.y=P.ty=d.y}}catch(e){}}
load();render();requestAnimationFrame(loop);
setInterval(save,3000);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
