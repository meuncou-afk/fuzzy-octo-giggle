<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Деревня — прототип</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{color-scheme:light;--bg:#eef1ee;--fg:#1d2420;--mut:#5d6a62;--line:#d2dad4;--card:#f9faf9;--me:#1f6feb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121816;--fg:#e8eee9;--mut:#93a198;--line:#27312c;--card:#1a221e;--me:#5aa2ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816;--fg:#e8eee9;--mut:#93a198;--line:#27312c;--card:#1a221e;--me:#5aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Press Start 2P",monospace}
main{max-width:1000px;margin:0 auto;padding:12px}
h1{font-size:.95rem;line-height:1.4;margin:0 0 6px}
p{margin:0 0 8px;color:var(--mut);font-size:.55rem;line-height:1.7}
#hud{font-size:.65rem;margin:8px 0;line-height:1.8}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:4px solid var(--fg);touch-action:manipulation}
button{font:inherit;font-size:.55rem;padding:10px;border:3px solid var(--fg);background:var(--me);color:#fff;box-shadow:3px 3px 0 var(--fg);cursor:pointer;width:100%}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
button:disabled{background:transparent;color:var(--mut);box-shadow:none;border-color:var(--line);cursor:default}
.card{display:flex;justify-content:space-between;align-items:center;gap:8px;border:3px solid var(--fg);background:var(--card);padding:8px;margin-bottom:8px;box-shadow:3px 3px 0 var(--line)}
.card small{display:block;color:var(--mut);font-size:.5rem;margin-top:4px}
.card button{width:auto}
#ui button{margin-bottom:8px;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<main>
<h1>Деревня</h1>
<p>Нажмите на землю, чтобы идти. Нажмите на дерево, камень или куст, чтобы добывать. Из дерева и камня стройте дома.</p>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="ui"></div>
</main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),ui=document.getElementById('ui');
const T=16,N=96,dpr=window.devicePixelRatio||1;let W=360,H=400;
function fit(){const aw=Math.min(960,document.querySelector('main').clientWidth-32),z=Math.max(1,Math.floor(aw/330));
 W=Math.round(aw/z);H=Math.round(Math.max(300,Math.min(innerHeight*.58,aw*1.1))/z);
 cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W*z+'px';cv.style.height=H*z+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}
fit();addEventListener('resize',fit);
const css=getComputedStyle(document.documentElement),dk=()=>css.colorScheme=='dark';
const HERO=['..XXXX..','.XXXXXX.','.XoXXoX.','..XXXX..','.XXXXXX.','X.XXXX.X','..X..X..','.XX..XX.'];
const spr=(m,x,y,c,s)=>m.forEach((row,r)=>{for(let q=0;q<8;q++){const h=row[q];if(h=='.')continue;ctx.fillStyle=h=='o'?'#1d2420':c;ctx.fillRect(Math.round(x-4*s+q*s),Math.round(y-4*s+r*s),s,s)}});
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
let sd=11;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const D={tree:{h:4,g:'wood',n:3},rock:{h:5,g:'stone',n:2},bush:{h:2,g:'berry',n:2}};
const O=[],at={};
for(let i=0;i<650;i++){const x=rnd()*N|0,y=rnd()*N|0,k=x+','+y;if(at[k]||Math.hypot(x-48,y-48)<6)continue;const q=rnd(),t=q<.55?'tree':q<.8?'rock':'bush';const o={t,x,y,hp:D[t].h,dead:false,back:0,hit:0};O.push(o);at[k]=o}
O.sort((a,b)=>a.y-b.y);
const hs=new Set(),HS=[];
const addH=(x,y,t)=>{HS.push([x,y,t,HS.length]);for(let a=0;a<2;a++)for(let b=0;b<2;b++)hs.add((x+a)+','+(y+b))};addH(45,45,'house');
const free=(x,y)=>{if(x<0||y<0||x+1>=N||y+1>=N)return false;for(let a=0;a<2;a++)for(let b=0;b<2;b++){const k=(x+a)+','+(y+b);if(at[k]||hs.has(k))return false}return true};
const P={x:48*T,y:50*T,tx:48*T,ty:50*T,tg:null,ht:0},inv={wood:0,stone:0,berry:0},cam={x:0,y:0};
let build=null,gt=0,last=performance.now();
const BT={house:{n:'Дом',c:[10,4]},forge:{n:'Кузница',c:[20,15]}},WL=['#8a4b2a','#7a7f86','#a0693a','#6b4a7a','#5e7f6a','#a88a4a'],RF=['#c0392b','#2f5fa8','#2f8a4a','#d98a1a','#7a4b9a','#c0392b'],
WPN=[{id:'sword',n:'Меч',c:[6,6],d:8},{id:'bow',n:'Лук',c:[10,3],d:6},{id:'axe',n:'Боевой топор',c:[8,10],d:12}],own={};
let fo=false;
const can=c=>inv.wood>=c[0]&&inv.stone>=c[1],cs=c=>c[0]+'🪵 '+c[1]+'🪨',uc=l=>[4*l+2,4*l],nh=()=>HS.filter(h=>h[2]=='house').length,fb=()=>HS.some(h=>h[2]=='forge');
function render(){
 hud.textContent='🪵 '+inv.wood+'  🪨 '+inv.stone+'  🍓 '+inv.berry+'  🏠 '+nh();
 let h='';
 if(build)h+='<button data-a="cancel">Отмена: нажмите на свободное место</button>';
 else{h+=`<button data-a="b:house" ${can(BT.house.c)?'':'disabled'}>Построить дом ${cs(BT.house.c)}</button>`;
  if(!fb()){if(nh()>=2)h+=`<button data-a="b:forge" ${can(BT.forge.c)?'':'disabled'}>Построить кузницу ${cs(BT.forge.c)}</button>`;else h+='<p>Кузница откроется после второго дома.</p>'}}
 if(fo){h+='<p><b>Кузница</b>: удерживайте кнопку секунду.</p>';
  WPN.forEach(w=>{const lv=own[w.id],dm=l=>Math.round(w.d*(1+.2*(l-1)));
   const b=!lv?`<button data-a="mk:${w.id}" ${can(w.c)?'':'disabled'}>Создать ${cs(w.c)}</button>`:lv<5?`<button data-a="up:${w.id}" ${can(uc(lv))?'':'disabled'}>Улучшить ${cs(uc(lv))}</button>`:'<button disabled>Максимум</button>';
   h+=`<div class="card"><div><b>${w.n}</b><small>${lv?'уровень '+lv+', урон '+dm(lv):'урон '+dm(1)}</small></div>${b}</div>`});
  h+='<button data-a="close">Закрыть кузницу</button>'}
 ui.innerHTML=h}
ui.addEventListener('pointerdown',e=>{const a=e.target.dataset.a;if(!a||e.target.disabled)return;const[k,id]=a.split(':');
 if(k=='b')build=id;if(k=='cancel')build=null;if(k=='close')fo=false;
 if(k=='mk'){const w=WPN.find(x=>x.id==id);if(!own[id]&&can(w.c)){inv.wood-=w.c[0];inv.stone-=w.c[1];own[id]=1}}
 if(k=='up'&&own[id]&&own[id]<5){const c=uc(own[id]);if(can(c)){inv.wood-=c[0];inv.stone-=c[1];own[id]++}}
 render()});
let hold=null,go=false;
const stopHold=()=>{if(hold){clearTimeout(hold.id);hold=null;render()}};
addEventListener('pointerup',stopHold);addEventListener('pointercancel',stopHold);
ui.addEventListener('contextmenu',e=>e.preventDefault());
ui.addEventListener('pointerdown',e=>{const a=e.target.dataset.a;if(go||!a||!/^(mk|up)/.test(a)||e.target.disabled)return;e.stopPropagation();
 hold={a,t0:performance.now(),id:setTimeout(()=>{hold=null;const el=ui.querySelector('[data-a="'+a+'"]');if(el&&!el.disabled){go=true;el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));go=false}},1000)}},true);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),wx=cam.x+(e.clientX-r.left)*W/r.width,wy=cam.y+(e.clientY-r.top)*H/r.height,tx=wx/T|0,ty=wy/T|0;
 if(build){const bt=BT[build];if(free(tx,ty)&&can(bt.c)){inv.wood-=bt.c[0];inv.stone-=bt.c[1];addH(tx,ty,build);build=null;render()}return}
 const fh=HS.find(h=>h[2]=='forge'&&tx>=h[0]&&tx<=h[0]+1&&ty>=h[1]&&ty<=h[1]+1);
 if(fh){P.tg=null;P.tx=fh[0]*T+16;P.ty=(fh[1]+2)*T+8;P.of=true;return}
 P.of=false;if(fo){fo=false;render()}
 const o=at[tx+','+ty];
 if(o&&!o.dead){P.tg=o;P.tx=o.x*T+8;P.ty=o.y*T+8}else{P.tg=null;P.tx=wx;P.ty=wy}});
function update(dt){
 gt+=dt;
 O.forEach(o=>{if(o.dead&&gt>o.back){o.dead=false;o.hp=D[o.t].h}if(o.hit>0)o.hit-=dt});
 const tg=P.tg;
 if(tg&&Math.hypot(tg.x*T+8-P.x,tg.y*T+8-P.y)<=16){P.tx=P.x;P.ty=P.y;P.ht-=dt;
  if(P.ht<=0){P.ht=.6;tg.hit=.12;if(--tg.hp<=0){inv[D[tg.t].g]+=D[tg.t].n;tg.dead=true;tg.back=gt+45;P.tg=null;render()}}return}
 const dx=P.tx-P.x,dy=P.ty-P.y,m=Math.hypot(dx,dy);
 if(m>2){const s=Math.min(m,80*dt);P.x+=dx/m*s;P.y+=dy/m*s}
 if(P.of&&Math.hypot(P.tx-P.x,P.ty-P.y)<=3){P.of=false;fo=true;render()}
 P.x=Math.max(8,Math.min(N*T-8,P.x));P.y=Math.max(8,Math.min(N*T-8,P.y))}
function draw(){
 cam.x=Math.max(0,Math.min(N*T-W,P.x-W/2));cam.y=Math.max(0,Math.min(N*T-H,P.y-H/2));
 const g1=dk()?'#2c4a2a':'#a8cf78',g2=dk()?'#27421f':'#9cc56c';
 for(let y=cam.y/T|0;y<=(cam.y+H)/T;y++)for(let x=cam.x/T|0;x<=(cam.x+W)/T;x++)R((x+y)%2?g1:g2,x*T-cam.x,y*T-cam.y,T,T);
 O.forEach(o=>{let sx=o.x*T-cam.x,sy=o.y*T-cam.y;if(sx<-T||sy<-T||sx>W||sy>H)return;
  if(o.hit>0)sx+=1;
  if(o.dead){R('#6b5a3a',sx+5,sy+12,6,4);return}
  if(o.t=='tree'){R('#6b3f1d',sx+6,sy+8,4,8);R('#2f7a3a',sx+1,sy,14,10);R('#3f9a4a',sx+3,sy-3,10,4)}
  else if(o.t=='rock'){R('#8c948d',sx+1,sy+6,14,10);R('#a7aea8',sx+4,sy+3,8,5)}
  else{R('#2f8a4a',sx+1,sy+7,14,9);R('#d6402f',sx+4,sy+9,2,2);R('#d6402f',sx+10,sy+11,2,2)}
  if(P.tg===o&&o.hp<D[o.t].h){R('#1d2420',sx,sy-6,16,3);R('#ffd45c',sx,sy-6,16*o.hp/D[o.t].h,3)}});
 HS.forEach(([x,y,t,i])=>{const sx=x*T-cam.x,sy=y*T-cam.y;
  if(t=='forge'){R('#6e757c',sx+2,sy+12,28,20);R('#3d4248',sx-2,sy+6,36,8);R('#3d4248',sx+4,sy,24,8);R('#555b61',sx+22,sy-8,6,10);R('#1d2420',sx+10,sy+18,12,14);R('#ff9a2e',sx+12,sy+24,8,8);return}
  const q=i%6;R(WL[q],sx+2,sy+12,28,20);R(RF[q],sx-2,sy+6,36,8);R(RF[q],sx+4,sy,24,8);R('#1d2420',sx+(q%2?18:12),sy+20,8,12);R('#ffd45c',sx+(q%2?6:20),sy+16,5,5)});
 R('rgba(0,0,0,.25)',P.x-cam.x-6,P.y-cam.y+6,12,3);
 spr(HERO,P.x-cam.x,P.y-cam.y,'#1f6feb',2);
 R('rgba(0,0,0,.45)',W-54,6,48,48);
 O.forEach(o=>{if(!o.dead)R(o.t=='tree'?'#3f9a4a':o.t=='rock'?'#a7aea8':'#d6402f',W-54+o.x/2,6+o.y/2,1,1)});
 HS.forEach(([x,y,t])=>R(t=='forge'?'#ff9a2e':'#ffd45c',W-54+x/2,6+y/2,3,3));
 R('#fff',W-54+P.x/T/2-1,6+P.y/T/2-1,3,3)}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();if(hold){const el=ui.querySelector('[data-a="'+hold.a+'"]');if(el){const p=Math.min(100,(performance.now()-hold.t0)/10);el.style.backgroundImage='linear-gradient(90deg,rgba(255,255,255,.4) '+p+'%,transparent '+p+'%)'}}requestAnimationFrame(loop)}
render();requestAnimationFrame(loop);
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
</script>
</body>
</html>
