<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Деревня — прототип</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:light;--bg:#f3f5f2;--card:#fff;--soft:#e8ede9;--line:#dce2dd;--fg:#18201b;--mut:#66716a;--acc:#2f7d57;--on:#fff;--bad:#d23b2f;--warn:#a86a0c;--sh:rgba(0,0,0,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1412;--card:#18201c;--soft:#232d28;--line:#2c3832;--fg:#e8eee9;--mut:#8e9b93;--acc:#43b27e;--on:#07140d;--bad:#ff6b5e;--warn:#e0a93b;--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1412;--card:#18201c;--soft:#232d28;--line:#2c3832;--fg:#e8eee9;--mut:#8e9b93;--acc:#43b27e;--on:#07140d;--bad:#ff6b5e;--warn:#e0a93b;--sh:rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* верхняя панель */
#top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px}
#hud{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.bad{color:var(--bad);border-color:var(--bad)}
#rt{flex:none;display:flex;align-items:center;gap:8px}
#hp{position:relative;width:76px;height:28px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
#hp b{position:absolute;inset:0 auto 0 0;background:rgba(224,70,58,.38)}
#hp span{position:relative;display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;font-weight:700}
#arm{width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;color:var(--fg)}
#arm:active{background:var(--soft)}
#demo{flex:none;padding:0 12px 6px;font-size:11px;color:var(--warn)}
#demo:empty{display:none}

/* карта */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;flex:none;image-rendering:pixelated;touch-action:manipulation}

/* нижняя панель */
#sheet{flex:none;height:40%;display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -8px 28px var(--sh);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#sheet.open{height:72%}
@media(max-height:520px){#sheet{height:56%}#sheet.open{height:86%}}
#grip{flex:none;width:100%;height:24px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
#grip span{width:40px;height:4px;border-radius:4px;background:var(--line)}
#tabs{flex:none;display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:8px 14px;background:transparent;color:var(--mut);font:600 13px system-ui,sans-serif;cursor:pointer}
.tab.on{background:var(--soft);color:var(--fg)}
#ui{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px 40px}

/* элементы списка */
h3{margin:14px 2px 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
h3:first-child{margin-top:2px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border-radius:14px;background:var(--bg)}
.item .t{flex:1;min-width:0}
.item b{font-size:14px;font-weight:650}
.item small{display:block;margin-top:2px;font-size:12px;line-height:1.35;color:var(--mut)}
.item.lock{opacity:.55}
.item.hl{outline:2px solid var(--acc);outline-offset:-2px}
.cost{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:6px;font-size:12px;font-weight:600}
.cost i{font-style:normal}
.cost i.no{color:var(--bad)}
.acts{display:flex;flex-direction:column;gap:6px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;font-size:16px}
.btn{flex:none;min-width:92px;min-height:38px;padding:10px 14px;border:0;border-radius:11px;background:var(--acc);color:var(--on);font:650 13px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{background:var(--soft);color:var(--mut);cursor:default}
.btn.ghost{background:var(--soft);color:var(--fg)}
.btn.ghost:disabled{color:var(--mut)}
.btn.sm{min-width:0;min-height:32px;padding:7px 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:10px 12px;border-radius:14px;background:var(--bg)}
.stat b{display:block;margin:2px 0;font-size:18px;font-weight:700}
.stat small{display:block;font-size:11px;color:var(--mut)}
.hint{margin-bottom:8px;padding:11px 12px;border:1px dashed var(--line);border-radius:14px;font-size:13px;color:var(--mut)}
.help{margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:var(--mut)}
.help b{color:var(--fg)}

/* загрузка / ошибки */
#ov{display:none;position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.94);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-size:15px;line-height:1.6}
#ov button{min-width:0;padding:12px 20px;border:0;border-radius:11px;background:var(--acc);color:var(--on);font:650 14px system-ui,sans-serif;cursor:pointer}
</style>
</head>

 </div>
</div>

  const hs=(Array.isArray(p.hs)?p.hs:[]).filter(h=>Array.isArray(h)&&BTYPES.includes(h[2])&&ni(h[0])&&ni(h[1])&&h[0]>=0&&h[1]>=0&&h[0]<NW-1&&h[1]<NH-1).slice(0,60).map((h,i)=>[h[0],h[1],h[2],i,Math.max(1,Math.min(10,(h[3]|0)||1))]);
  const o=prev.get(p.id);
  out.push({id:p.id,name:String(p.name||'Игрок').replace(/[\u0000-\u001f]/g,'').slice(0,20),home:ni(p.home)?p.home:-1,x,y,rx:o?o.rx:x,ry:o?o.ry:y,fl:!!p.fl,mv:false,armor:p.armor!==false,eq:p.eq=='sword'||p.eq=='bow'?p.eq:null,hs})}
 WORLD.players=out}
let syncErr=0,syncOk=0;
async function syncOnce(){if(demo||locked||!started||document.hidden)return;
 try{const r=await api('sync',{home:HOME.i,x:Math.round(P.x),y:Math.round(P.y),fl:P.fl?1:0,armor,eq,hs:HS.map(h=>[h[0],h[1],h[2],h[4]||1])});
  if(r.s==200&&r.j&&Array.isArray(r.j.players)){syncErr=0;syncOk=performance.now();mergePlayers(r.j.players)}
  else if(r.s==409){locked=true;overlay('Игра открыта на другом устройстве.','Играть здесь',()=>location.reload())}
  else if(r.s==401){locked=true;overlay('Сессия устарела. Закройте игру и откройте её заново из Telegram.')}
  else syncErr++}catch(e){syncErr++}
 if(syncErr>=3&&performance.now()-syncOk>20000)WORLD.players=[]}
function syncLoop(){const run=async()=>{await syncOnce();setTimeout(run,syncErr>=3?30000:2500)};run()}
async function pickFreeHome(){try{const q=await api('sync',{peek:1});if(q.s==200&&q.j&&Array.isArray(q.j.players)){const taken=new Set(q.j.players.map(p=>p.home));let i=HOME.i;for(let k=0;k<SP.length&&taken.has(i);k++)i=(i+1)%SP.length;if(i!==HOME.i)setHome(i)}}catch(e){}}
async function boot(){
 try{localStorage.removeItem('village-save-v1')}catch(e){}
 if(API){overlay('Загрузка…');await tgWait()}
 if(!homeSet)setHome(homeFor(tgUid()||SID));
 if(!API||!initData()){demo=true;ov.style.display='none';document.getElementById('demo').textContent=API?'Демо-режим: откройте игру через Telegram, чтобы прогресс сохранялся на сервере.':'Демо-режим: сервер не подключён, прогресс не сохраняется.'}
 else{try{const r=await api('load');if(r.s!=200)throw new Error(r.s);if(r.j.data)apply(r.j.data);else await pickFreeHome();ov.style.display='none'}catch(e){overlay('Нет связи с сервером. Ваш прогресс не потерян.','Повторить',boot);return}}
 if(!started){started=true;render();requestAnimationFrame(loop);
  if(!demo){syncLoop();setInterval(()=>save(),15000);addEventListener('pagehide',()=>save(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)})}}}
document.getElementById('arm').addEventListener('pointerdown',e=>{e.preventDefault();armor=!armor;P.fx=.4;render()});boot();
const tgInit=()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}try{Telegram.WebApp.disableVerticalSwipes&&Telegram.WebApp.disableVerticalSwipes()}catch(e){}try{if(!localStorage.getItem('wa1')){localStorage.setItem('wa1','1');Telegram.WebApp.requestWriteAccess&&Telegram.WebApp.requestWriteAccess()}}catch(e){}};addEventListener('load',tgInit);tgInit();
</script>
